<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa — GenJutsu AI</title>
<link rel="icon" href="/assets/icon-crow.jpg">
<meta name="theme-color" content="#050505">
<meta name="description" content="A Casa GenJutsu: grupos, dispositivos e a Gen.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/casa.css">
</head>
<body class="page-casa">
<a class="skip" href="#casa-ask">Ir para Pergunte para o Gen</a>
<div class="casa-app">
  <aside class="casa-rail" aria-label="Navegação">
    <a class="casa-brand" href="/">
      <img src="/assets/icon-crow.jpg" alt="">
      GenJutsu
    </a>
    <nav>
      <a href="/">Início</a>
      <a href="/casa" aria-current="page">Casa</a>
      <a href="/gen">Gen</a>
      <a href="/admin">Admin</a>
    </nav>
  </aside>

  <div class="casa-stage">
    <header class="casa-top">
      <div class="casa-home-name">
        <img src="/assets/icon-crow.jpg" alt="">
        <h1 id="casa-title">Sua casa</h1>
      </div>
      <button class="casa-add" type="button" aria-label="Adicionar" hidden>+</button>
    </header>

    <div class="casa-layout">
      <section class="casa-preview" aria-label="Imagem da casa">
        <div class="casa-frame" id="casa-frame" data-profile="">
          <img id="casa-photo" alt="Casa mobiliada do seu perfil" src="/assets/casa/acolhedor.jpg">
          <div class="casa-overlay" data-room="quarto" id="overlay-quarto"></div>
          <div class="casa-overlay" data-room="sala" id="overlay-sala"></div>
          <div class="casa-overlay" data-room="cozinha" id="overlay-cozinha"></div>
          <div class="casa-overlay" data-room="casa" id="overlay-casa"></div>
        </div>
        <p class="casa-profile-caption" id="casa-profile-caption"></p>
      </section>

      <section class="casa-panel">
        <div class="casa-understood" id="casa-understood">
          <h2>O que a casa entendeu de você</h2>
          <p id="casa-badges" class="casa-badges"></p>
          <p id="casa-understood-copy" class="casa-understood-copy"></p>
        </div>

        <div class="casa-groups">
          <div class="casa-section-head">
            <h2>Grupos</h2>
            <button class="casa-ver-tudo" type="button" id="btn-groups-all">Ver tudo</button>
          </div>
          <div class="casa-group-row" role="list">
            <button type="button" class="casa-group" data-room="Quarto" role="listitem" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V9.5A1.5 1.5 0 0 1 4.5 8H20a1 1 0 0 1 1 1v9M3 14h18M6 8V6.5A1.5 1.5 0 0 1 7.5 5h4A1.5 1.5 0 0 1 13 6.5V8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              Quarto
            </button>
            <button type="button" class="casa-group" data-room="Sala" role="listitem" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16V10l4-3h8l4 3v6M4 16h16M7 16v3M17 16v3M8 12h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Sala
            </button>
            <button type="button" class="casa-group" data-room="Cozinha" role="listitem" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15c0 2.2 2.2 4 5 4s5-1.8 5-4V9H7v6zM9 9V6M15 9V7m-3 0V5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8 19h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              Cozinha
            </button>
          </div>
        </div>

        <div class="casa-devices">
          <h2>Dispositivos</h2>
          <div class="casa-filters">
            <label class="casa-search">
              <span class="sr-only">Buscar</span>
              <input id="device-search" type="search" placeholder="Buscar" autocomplete="off">
            </label>
            <label class="casa-select">
              <span class="sr-only">Tipo de dispositivo</span>
              <select id="device-kind">
                <option value="">Tipo De Dispositivo</option>
                <option value="light">Luz</option>
                <option value="led">LED</option>
                <option value="media">Mídia</option>
                <option value="ambience">Ambiente</option>
              </select>
            </label>
            <label class="casa-select">
              <span class="sr-only">Classificar por</span>
              <select id="device-sort">
                <option value="room">Classificar Por</option>
                <option value="name">Nome</option>
              </select>
            </label>
          </div>
          <ul class="casa-device-list" id="device-list"></ul>
        </div>
      </section>
    </div>
  </div>

  <div class="casa-dock">
    <div class="casa-chips" id="casa-chips" aria-label="Sugestões da casa"></div>
    <p class="casa-voice-status" id="casa-voice-status" role="status" aria-live="polite"></p>
    <div class="casa-ask" role="group" aria-label="Pergunte para o Gen">
      <button class="casa-ask-text" id="casa-ask" type="button">Pergunte para o Gen</button>
      <button type="button" class="casa-mic" id="casa-dock-voice" aria-label="Falar"></button>
    </div>
  </div>
</div>

<div class="casa-sheet" id="casa-sheet" hidden>
  <div class="casa-sheet-card" role="dialog" aria-labelledby="gen-sheet-title">
    <header>
      <div>
        <img src="/assets/icon-crow.jpg" alt="">
        <h2 id="gen-sheet-title">Gen</h2>
      </div>
      <button type="button" id="casa-sheet-close" aria-label="Fechar">×</button>
    </header>
    <ol class="casa-thread" id="casa-thread"></ol>
    <form id="casa-form" class="casa-compose">
      <label class="sr-only" for="casa-text">Pergunte para o Gen</label>
      <input id="casa-text" name="text" maxlength="400" placeholder="Pergunte para o Gen" autocomplete="off">
      <button type="button" id="casa-voice" class="casa-mic" aria-label="Falar"></button>
      <button type="submit" class="casa-send" aria-label="Enviar">➤</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/casa-suggestions.js"></script>
<script src="/js/casa-view.js"></script>
<script src="/js/casa-voice.js"></script>
<script src="/js/casa.js"></script>
</body>
</html>
