<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumo da sessão — GenJutsu AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/zcea-profile.js"></script>
<script src="/js/personality.js"></script>
</head>
<body class="page-summary">
<div class="summary-sheet">
  <article class="parchment" aria-labelledby="summary-kicker">
    <p class="parchment-kicker" id="summary-kicker">Leitura da casa</p>
    <h1 class="parchment-name" id="name"></h1>
    <p class="parchment-phrase" id="phrase">Buscando a frase desta sessão.</p>
    <p class="parchment-sign" id="arch">Carregando…</p>
  </article>
  <section class="session-record" aria-labelledby="record-title">
    <h2 id="record-title">Registros desta sessão</h2>
    <div class="guest-flag" id="guest-flag" hidden>Salvo sem conta, como visitante</div>
    <dl id="summary-records"></dl>
    <p class="lbl">Código da sessão</p>
    <div class="code" id="code">—</div>
    <p class="record-foot" id="note">Este cartão não mostra agenda, contatos nem conversas completas.</p>
    <p><a href="/">Voltar ao GenJutsu AI</a></p>
  </section>
</div>
<script>
  function sessionFromUrl() {
    var parts = location.pathname.split("/").filter(Boolean);
    if (parts[0] === "s" && parts[1]) return parts[1].toUpperCase();
    return new URLSearchParams(location.search).get("c") || "";
  }

  async function main() {
    var code = sessionFromUrl();
    document.getElementById("code").textContent = code || "—";
    if (!code) {
      document.getElementById("arch").textContent = "Sem código";
      document.getElementById("phrase").textContent = "Abra /s/CODIGO ou aproxime o NFC gravado.";
      return;
    }
    var cfg;
    try {
      var res = await fetch("/api/config");
      cfg = await res.json();
    } catch (e) {
      document.getElementById("arch").textContent = "Erro";
      document.getElementById("phrase").textContent = "Não foi possível ler a configuração.";
      return;
    }
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      document.getElementById("arch").textContent = "Config ausente";
      return;
    }
    var sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var result = await sb
      .from("session_summaries")
      .select("display_name, personality_text, archetype, profile_id")
      .eq("session_code", code)
      .maybeSingle();
    if (result.error) {
      result = await sb
        .from("session_summaries")
        .select("display_name, personality_text, archetype")
        .eq("session_code", code)
        .maybeSingle();
    }
    if (result.error || !result.data) {
      document.getElementById("arch").textContent = "Não encontrado";
      document.getElementById("phrase").textContent = "Esse código ainda não tem resumo. Peça à pessoa para entrar e salvar o perfil.";
      return;
    }
    var data = result.data;
    var P = window.GenjutsuPersonality;
    var name = data.display_name || "";
    var guest = /^Visitante\b/.test(name);
    var phrase = P.phraseFor(data.profile_id || data.archetype, name);
    document.getElementById("arch").textContent = P.formatArchetype(data.profile_id || data.archetype);
    document.getElementById("name").textContent = name;
    document.getElementById("phrase").textContent = phrase || data.personality_text || "";
    var fields = P.sessionFields({
      display_name: name,
      profile_id: data.profile_id || "",
      archetype: data.archetype || "",
      session_code: code,
      personality_text: data.personality_text || "",
      fonte: guest ? "convidado" : ""
    });
    var dl = document.getElementById("summary-records");
    fields.forEach(function (pair) {
      var dt = document.createElement("dt");
      dt.textContent = pair[0];
      var dd = document.createElement("dd");
      dd.textContent = pair[1];
      if (pair[0] === "Código da sessão") dd.className = "record-code";
      dl.appendChild(dt);
      dl.appendChild(dd);
    });
    if (guest) document.getElementById("guest-flag").hidden = false;
  }
  main();
</script>
</body>
</html>
