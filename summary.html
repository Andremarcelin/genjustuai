<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumo da sessão — GenJutsu AI</title>
<link rel="icon" href="/assets/icon-crow.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/personality.js"></script>
</head>
<body class="page-summary">
<div class="summary-card">
  <img class="portrait" id="portrait" src="/assets/og-hero.jpg" alt="GenJutsu AI">
  <h1>GenJutsu AI</h1>
  <p>Resumo da sessão</p>
  <div class="code" id="code">—</div>
  <div>
    <div class="arch" id="arch">Carregando…</div>
    <div class="guest-flag" id="guest-flag" hidden>Sem conta Google</div>
  </div>
  <p id="name"></p>
  <p id="text">Buscando personalidade desta sessão.</p>
  <p id="note">Este cartão não mostra agenda, contatos nem conversas completas.</p>
  <p><a href="/">Voltar ao GenJutsu AI</a></p>
</div>
<script>
  function sessionFromUrl() {
    var parts = location.pathname.split("/").filter(Boolean);
    if (parts[0] === "s" && parts[1]) return parts[1].toUpperCase();
    return new URLSearchParams(location.search).get("c") || "";
  }

  async function main() {
    var code = sessionFromUrl();
    document.getElementById("code").textContent = code || "—";
    if (!code) {
      document.getElementById("arch").textContent = "Sem código";
      document.getElementById("text").textContent = "Abra /s/CODIGO ou aproxime o NFC gravado.";
      return;
    }
    var cfg;
    try {
      var res = await fetch("/api/config");
      cfg = await res.json();
    } catch (e) {
      document.getElementById("arch").textContent = "Erro";
      document.getElementById("text").textContent = "Não foi possível ler a configuração.";
      return;
    }
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      document.getElementById("arch").textContent = "Config ausente";
      return;
    }
    var sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var result = await sb
      .from("session_summaries")
      .select("display_name, personality_text, archetype")
      .eq("session_code", code)
      .maybeSingle();
    if (result.error || !result.data) {
      document.getElementById("arch").textContent = "Não encontrado";
      document.getElementById("text").textContent = "Esse código ainda não tem resumo. Peça à pessoa para entrar e salvar o perfil.";
      return;
    }
    var data = result.data;
    var name = data.display_name || "";
    var guest = /^Visitante\b/.test(name);
    document.getElementById("arch").textContent = window.GenjutsuPersonality.formatArchetype(data.archetype);
    document.getElementById("name").textContent = name;
    document.getElementById("text").textContent = data.personality_text || "";
    if (guest) {
      var portrait = document.getElementById("portrait");
      portrait.src = "/assets/guest-avatar.jpg";
      portrait.alt = "Silhueta de visitante";
      document.getElementById("guest-flag").hidden = false;
    }
  }
  main();
</script>
</body>
</html>
